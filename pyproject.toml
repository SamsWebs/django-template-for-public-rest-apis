[project]
name = "django-serverless-template"
version = "1.0.0"
requires-python = ">=3.9"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"specs/**" = ["ANN"]

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true
